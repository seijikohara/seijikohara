# Refreshes the committed profile cards and badges on a schedule.
#
# The generator lives in seijikohara/profile-cards-action; this repository is
# just its consumer. That action is first-party and pinned to a major tag, so
# the scheduled path still carries no unmaintained third-party code — the reason
# the previous pipeline avoided actions entirely.
name: Profile

on:
  schedule:
    - cron: "17 */6 * * *" # offset from the top of the hour (documented high-load window)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest will eventually move to 26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Render and commit profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: seijikohara
          cards: overview,lifetime,contributions,composition,rhythm,cadence,repositories,languages
          output-dir: assets
          themes: light,dark
          font: Roboto
          mono-font: Roboto Mono
          # Brand names only; the README supplies each badge's link.
          badges: |
            LinkedIn
            Facebook
            Findy
            LAPRAS
            Wantedly
            Qiita
            Zenn
            Maven Central
            npm
          commit: true

  keepalive:
    # Public-repo schedules are disabled after 60 days without "repository
    # activity", and GitHub does not document whether bot commits count.
    # Re-enabling the workflow is the documented reset, so do it every run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset the scheduled-workflow inactivity timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable profile.yml --repo "${GITHUB_REPOSITORY}"
