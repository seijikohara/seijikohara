# Refreshes the committed profile cards and badges on a schedule. Pull requests
# render the same cards without committing them.
#
# The generator lives in seijikohara/profile-cards-action; this repository is
# just its consumer. That action is first-party and pinned to a major tag, so
# the scheduled path still carries no unmaintained third-party code — the reason
# the previous pipeline avoided actions entirely.
name: Profile

on:
  schedule:
    - cron: "17 */6 * * *" # offset from the top of the hour (documented high-load window)
  workflow_dispatch:
  # Renovate automerges only after a status check passes on the update branch,
  # and this repository has no other check. Rendering the cards with the
  # proposed action versions gives Renovate that check without committing.
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest will eventually move to 26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Render profile cards and commit them outside pull requests
        uses: seijikohara/profile-cards-action@10a2b4619ce449de517124d4fb1e92c3fd4185c4 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: seijikohara
          # No `cards`: the action's default is every card it can draw, and a
          # list repeated here goes stale the day the action gains one.
          # One image for every card, stacked in the default order: the README
          # embeds a single <picture>, and the fonts are embedded once.
          layout: combined
          output-dir: assets
          themes: light,dark
          font: Roboto
          mono-font: Roboto Mono
          # 24 languages in total; 12 rows keep the long tail readable without
          # making the card much taller than its neighbours.
          language-limit: 12
          # Print the counts each step of the green ramp stands for. Less…More
          # says only which end is which.
          legend: scale
          # Brand names only; the README supplies each badge's link.
          badges: |
            LinkedIn
            Facebook
            Findy
            LAPRAS
            Wantedly
            Qiita
            Zenn
            Maven Central
            npm
          commit: ${{ github.event_name != 'pull_request' }}

  keepalive:
    # Public-repo schedules are disabled after 60 days without "repository
    # activity", and GitHub does not document whether bot commits count.
    # Re-enabling the workflow is the documented reset, so do it every run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reset the scheduled-workflow inactivity timer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable profile.yml --repo "${GITHUB_REPOSITORY}"
